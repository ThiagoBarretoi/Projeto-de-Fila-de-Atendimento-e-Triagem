<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Eventos POA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de coluna única (até 820px), cabeçalho fixo com abas; cartão só onde há um objeto (evento, ingresso, formulário). */
:root{
  --bg:#EDF3F4;--sf:#FFFFFF;--sf2:#F5F9FA;--ink:#12232A;--mu:#52656D;--ln:#D0DCE0;
  --br:#1A6E7F;--bi:#FFFFFF;--brs:#D7EBF0;--sun:#F2B84B;--si:#3D2900;
  --ok:#24744A;--okbg:#DDF1E5;--er:#AD3329;--erbg:#F8E1DE;--wt:#CBE3EA;
  --f-d:"Fraunces",Georgia,"Times New Roman",serif;
  --f-b:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E191E;--sf:#15242B;--sf2:#1A2C34;--ink:#E5EEF1;--mu:#9DB0B8;--ln:#29404A;
  --br:#55B8CB;--bi:#05232A;--brs:#173842;--ok:#6FCF97;--okbg:#173527;--er:#F28B80;--erbg:#3D1E1B;--wt:#1A3B46;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E191E;--sf:#15242B;--sf2:#1A2C34;--ink:#E5EEF1;--mu:#9DB0B8;--ln:#29404A;
  --br:#55B8CB;--bi:#05232A;--brs:#173842;--ok:#6FCF97;--okbg:#173527;--er:#F28B80;--erbg:#3D1E1B;--wt:#1A3B46;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.w{max-width:820px;margin:0 auto;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-d);font-weight:700;margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:26px;letter-spacing:-.01em}h2{font-size:22px}h3{font-size:18px}
p{margin:0}
.mu{color:var(--mu);font-size:14px}
.sm{font-size:13px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:16px;border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--sun);display:grid;place-items:center;flex:none}
nav{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:inherit;font-size:15px;color:var(--mu);cursor:pointer;white-space:nowrap}
nav button[aria-current="page"]{color:var(--ink);border-color:var(--br);font-weight:600}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--brs);color:var(--ink);font-size:12px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
main{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:20px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--br);color:var(--bi);border-color:var(--br)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:14px;font-weight:500;margin:0 0 4px}
.field{min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{width:18px;height:18px;margin-top:2px;flex:none}
.btn{font:inherit;font-weight:500;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;padding:9px 16px;cursor:pointer}
.btn.p{background:var(--br);color:var(--bi);border-color:var(--br);font-weight:600}
.btn.d{color:var(--er);border-color:var(--er)}
.btn.lnk{border:0;background:none;padding:6px 0;color:var(--br);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wide{width:100%}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.tag{font-size:12px;font-weight:500;border-radius:4px;padding:2px 8px;background:var(--wt);color:var(--ink);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.er{background:var(--erbg);color:var(--er)}
.tag.hot{background:var(--sun);color:var(--si)}
.err{color:var(--er);font-size:14px;min-height:0}
.err:empty{display:none}
.note{background:var(--sf2);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--mu)}
/* lista de eventos */
.ev{display:flex;gap:4px;padding:0;overflow:hidden}
.ev:hover{border-color:var(--br)}
.evmain{flex:1;display:flex;gap:14px;align-items:stretch;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:14px;cursor:pointer;min-width:0}
.dt{flex:none;width:60px;border-radius:8px;background:var(--sun);color:var(--si);text-align:center;padding:7px 0;line-height:1.1;align-self:flex-start}
.dt b{display:block;font-size:24px;font-family:var(--f-d)}.dt span{font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.dt.today{background:var(--br);color:var(--bi)}
.evinfo{display:flex;flex-direction:column;gap:4px;min-width:0}
.fav{flex:none;align-self:flex-start;background:none;border:0;padding:14px;cursor:pointer;color:var(--mu)}
.fav[aria-pressed="true"]{color:var(--er)}
.fav svg{width:22px;height:22px;display:block}
.fav[aria-pressed="true"] path{fill:currentColor}
/* filtros */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.filters{grid-template-columns:1fr}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.g2{grid-template-columns:1fr}}
/* ingressos e compra */
.tk{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.tk:first-of-type{border-top:0}
.q{display:flex;align-items:center;gap:10px;flex:none}
.q button{width:36px;height:36px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font-size:18px;cursor:pointer;line-height:1}
.q b{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding-top:12px;border-top:1px solid var(--ln);font-variant-numeric:tabular-nums}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay label{display:flex;gap:10px;align-items:center;border:1px solid var(--ln);border-radius:8px;padding:12px;cursor:pointer;margin:0}
.pay label:has(input:checked){border-color:var(--br);background:var(--brs)}
.pay input{width:auto}
.qr{background:#fff;padding:8px;border-radius:8px;display:inline-block;line-height:0;flex:none}
.copy{display:flex;gap:8px}
.copy code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--sf2);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;font-size:13px}
.ticket{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.ticket.past{opacity:.62}
@media(max-width:440px){.ticket{grid-template-columns:1fr}}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;letter-spacing:.06em}
/* mapa */
.mapw{overflow-x:auto}
svg.map{width:100%;min-width:320px;height:auto;border:1px solid var(--ln);border-radius:12px;background:var(--sf);display:block}
.pin{cursor:pointer}.pin circle{fill:var(--br)}.pin[aria-pressed="true"] circle{fill:var(--sun);stroke:var(--si);stroke-width:2}
.pin text{fill:var(--bi);font:700 13px var(--f-b)}.pin[aria-pressed="true"] text{fill:var(--si)}
.pin:focus-visible{outline:none}.pin:focus-visible circle{stroke:var(--sun);stroke-width:4}
.lb{fill:var(--mu);font:12px var(--f-b)}
/* organizador */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--sf2);border-radius:8px;padding:10px 12px;min-width:0}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
@media(max-width:440px){.stats{grid-template-columns:1fr 1fr}}
.bar{height:8px;border-radius:4px;background:var(--wt);overflow:hidden}
.bar i{display:block;height:100%;background:var(--br)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 16px;z-index:20;font-size:15px}
footer{margin-top:28px;text-align:center}
@media (prefers-reduced-motion:no-preference){.ev,.btn,.chip{transition:border-color .15s,background-color .15s}}
</style>
</head>
<body>

<div class="w">
  <header>
    <div class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D2900" stroke-width="2.2" stroke-linecap="round"><path d="M4 9a2 2 0 0 0 0 6v3h16v-3a2 2 0 0 1 0-6V6H4z"/><path d="M14 6v12" stroke-dasharray="2 2.5"/></svg></span>
        <h1>Eventos POA</h1>
      </div>
      <span class="mu">Agenda e ingressos de Porto Alegre</span>
    </div>
    <nav id="nav" aria-label="Seções"></nav>
  </header>
  <main id="m"></main>
  <footer><p class="mu sm">Protótipo com dados de exemplo. Nenhum pagamento real é feito e nenhum dado sai do seu navegador.</p></footer>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ---------- datas: os eventos de exemplo são sempre relativos a hoje ---------- */
var TODAY=new Date();TODAY.setHours(0,0,0,0);
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(n){var d=new Date(TODAY);d.setDate(d.getDate()+n);return iso(d)}
function parseD(s){return new Date(s+"T12:00")}
function daysFrom(s){var a=parseD(s),b=new Date(TODAY);b.setHours(12);return Math.round((a-b)/864e5)}
function fd(s){var d=parseD(s);return{w:d.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".",""),n:d.getDate(),m:d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","")}}
function whenLabel(s){var n=daysFrom(s),d=fd(s);return n===0?"Hoje":n===1?"Amanhã":d.w+", "+d.n+" de "+d.m}

/* ---------- dados ---------- */
var BAIRROS={"Centro Histórico":[150,118],"Cidade Baixa":[225,165],"Farroupilha":[235,100],"Moinhos de Vento":[292,58],"Praia de Belas":[170,214],"Humaitá":[300,236]};
var CATS=["Música","Teatro","Gastronomia","Esporte","Feira","Cinema"];
var SEED=[
 {id:9,t:"Roda de chimarrão e música nativista",c:"Música",b:"Centro Histórico",l:"Largo Glênio Peres",off:0,h:"19:00",ds:"Violão, gaita e roda de mate no fim de tarde. Traga sua cuia; a erva é por conta da casa.",tp:[{n:"Entrada gratuita",p:0,q:200,s:84}]},
 {id:10,t:"Sessão de curtas gaúchos",c:"Cinema",b:"Cidade Baixa",l:"Cineclube da Cidade Baixa",off:1,h:"19:30",ds:"Seis curtas de realizadores do estado, seguidos de conversa com as equipes.",tp:[{n:"Inteira",p:20,q:48,s:31},{n:"Meia-entrada",p:10,q:32,s:26,meia:1}]},
 {id:3,t:"Noite de samba",c:"Música",b:"Cidade Baixa",l:"Bar da República",off:3,h:"21:00",ds:"Roda de samba com repertório de raiz e convidados da cena local.",tp:[{n:"Inteira",p:40,q:90,s:61},{n:"Meia-entrada",p:20,q:60,s:42,meia:1}]},
 {id:1,t:"Pôr do sol com orquestra",c:"Música",b:"Centro Histórico",l:"Usina do Gasômetro",off:4,h:"18:00",ds:"Concerto ao ar livre com a orquestra de câmara da cidade, de frente para o Guaíba na hora do pôr do sol.",tp:[{n:"Inteira",p:60,q:180,s:132},{n:"Meia-entrada",p:30,q:120,s:95,meia:1},{n:"Camarote",p:120,q:30,s:27}]},
 {id:2,t:"Feira de livros usados",c:"Feira",b:"Farroupilha",l:"Parque da Redenção",off:5,h:"10:00",ds:"Sebos e livreiros independentes reunidos perto do espelho d'água. Troca de livros das 10h às 13h.",tp:[{n:"Entrada gratuita",p:0,q:500,s:212}]},
 {id:5,t:"Festival de comida de rua",c:"Gastronomia",b:"Moinhos de Vento",l:"Parcão",off:5,h:"12:00",ds:"Vinte food trucks, música ao vivo e espaço para crianças. A entrada solidária é revertida a bancos de alimentos.",tp:[{n:"Entrada solidária (1 kg de alimento)",p:0,q:300,s:181},{n:"Entrada + 2 fichas",p:25,q:200,s:93}]},
 {id:4,t:"Peça: Quando o Guaíba dorme",c:"Teatro",b:"Centro Histórico",l:"Teatro do Centro",off:10,h:"20:00",ds:"Drama sobre três gerações de uma família de pescadores das ilhas. Classificação: 14 anos.",tp:[{n:"Inteira",p:50,q:72,s:20},{n:"Meia-entrada",p:25,q:48,s:12,meia:1}]},
 {id:7,t:"Cinema ao ar livre",c:"Cinema",b:"Humaitá",l:"Praça do bairro",off:11,h:"20:30",ds:"Sessão gratuita de clássicos brasileiros. Leve cadeira ou canga.",tp:[{n:"Entrada gratuita",p:0,q:250,s:250}]},
 {id:6,t:"Corrida 5K da orla",c:"Esporte",b:"Praia de Belas",l:"Parque Marinha do Brasil",off:12,h:"07:30",ds:"Percurso plano pela orla. Inscrição inclui camiseta, número de peito e hidratação.",tp:[{n:"Inscrição",p:70,q:400,s:389}]},
 {id:8,t:"Jazz no bistrô",c:"Música",b:"Moinhos de Vento",l:"Bistrô Moinhos",off:17,h:"21:00",ds:"Trio de jazz em formato intimista, com mesas numeradas. Consumação à parte.",tp:[{n:"Inteira",p:80,q:36,s:10},{n:"Meia-entrada",p:40,q:24,s:4,meia:1}]}
];

/* ---------- armazenamento local (só neste navegador) ---------- */
var KEY="eventospoa.v2";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
var P=load();
var EV=SEED.map(function(e){var x=Object.assign({},e);x.d=addDays(e.off);x.sold=e.tp.map(function(t){return t.s});return x});
(P.mine||[]).forEach(function(e){if(e&&e.id&&e.tp)EV.push(e)});
if(P.sold)EV.forEach(function(e){var s=P.sold[e.id];if(Array.isArray(s)&&s.length===e.tp.length)e.sold=s});
function save(){try{var sold={};EV.forEach(function(e){sold[e.id]=e.sold});
 localStorage.setItem(KEY,JSON.stringify({tk:S.tk,mine:EV.filter(function(e){return e.mine}),sold:sold,fav:Array.from(S.fav),buyer:S.buyer}))}catch(e){}}

var S={v:"explorar",mode:"lista",q:"",cat:"Todas",when:"todos",b:"Todos",free:false,favOnly:false,
 sel:null,step:"detalhe",qty:{},err:"",busy:false,last:[],pay:"pix",pix:null,confirm:null,msg:{},
 tk:Array.isArray(P.tk)?P.tk:[],fav:new Set(P.fav||[]),buyer:P.buyer||{nm:"",em:""}};

/* ---------- utilidades ---------- */
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return"R$ "+n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function R(n){return n?money(n):"Gratuito"}
function byId(id){return EV.filter(function(e){return e.id==id})[0]}
function minP(e){return Math.min.apply(0,e.tp.map(function(t){return t.p}))}
function left(e,i){return Math.max(0,e.tp[i].q-e.sold[i])}
function totals(e){var q=0,s=0;e.tp.forEach(function(t,i){q+=t.q;s+=e.sold[i]});return{q:q,s:s,l:q-s}}
function status(e){var t=totals(e);if(t.l<=0)return'<span class="tag er">Esgotado</span>';if(t.l/t.q<.1)return'<span class="tag hot">Últimos ingressos</span>';return""}
function toast(m){var t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.k);toast.k=setTimeout(function(){t.hidden=true},2800)}
function code(p){var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",s="";for(var i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return p+s}
function qr(c,size){var h=0,i;for(i=0;i<c.length;i++)h=(h*31+c.charCodeAt(i))>>>0;var n=21,r="";
 function f(x,y){return(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12)}
 for(var y=0;y<n;y++)for(var x=0;x<n;x++){var on;if(f(x,y)){var ox=x>12?x-14:x,oy=y>12?y-14:y;on=ox<7&&oy<7&&(ox==0||ox==6||oy==0||oy==6||(ox>1&&ox<5&&oy>1&&oy<5))}else{h=(h*1103515245+12345)>>>0;on=(h>>>16)%2==0}
 if(on)r+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'}
 return'<span class="qr"><svg width="'+(size||112)+'" height="'+(size||112)+'" viewBox="0 0 21 21" role="img" aria-label="QR code '+esc(c)+' (simulado)" fill="#000" shape-rendering="crispEdges">'+r+'</svg></span>'}
var HEART='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.3 3 4.8 6.4 4.5 8.6 4.3 10.3 5.6 12 7.6c1.7-2 3.4-3.3 5.6-3.1 3.4.3 5.2 3.8 3.6 6.9C19 15.6 12 20 12 20z"/></svg>';

/* ---------- navegação (endereços #explorar, #ingressos, #organizador, #evento-ID) ---------- */
function route(){var h=location.hash.slice(1);
 if(h.indexOf("evento-")===0){var id=+h.slice(7),e=byId(id);
  if(e){S.v="explorar";if(S.sel!==id){S.sel=id;S.qty={};S.step="detalhe";S.err=""}}else{S.v="explorar";S.sel=null}}
 else{S.v=(h==="ingressos"||h==="organizador")?h:"explorar";S.sel=null}
 render(true)}
function go(h){if(location.hash==="#"+h)route();else location.hash=h}
window.addEventListener("hashchange",route);

function nav(){var a=[["explorar","Explorar",""],["ingressos","Meus ingressos",'<span class="count">'+S.tk.length+'</span>'],["organizador","Organizador",""]];
 $("nav").innerHTML=a.map(function(x){return'<button data-a="nav" data-v="'+x[0]+'"'+(S.v==x[0]?' aria-current="page"':"")+'>'+x[1]+x[2]+'</button>'}).join("")}
function render(top){nav();clearInterval(render.pt);
 if(S.v=="explorar"){if(S.sel==null)explorar();else if(S.step=="detalhe")detalhe();else if(S.step=="pagar")pagar();else if(S.step=="pix")pix();else ok()}
 else if(S.v=="ingressos")ingressos();else org();
 if(top)window.scrollTo(0,0)}

/* ---------- explorar ---------- */
function explorar(){
 var whens=[["todos","Qualquer data"],["hoje","Hoje"],["fds","Fim de semana"],["30","Próximos 30 dias"]];
 $("m").innerHTML='<section class="card stack" aria-label="Filtros">'+
 '<div class="field"><label for="q">Buscar evento ou local</label><input id="q" type="search" placeholder="Ex.: samba, Redenção, corrida" value="'+esc(S.q)+'"></div>'+

 var ne={id:Date.now(),t:T,c:$("oc").value,b:$("ob").value,l:L,d:D,h:H,ds:$("ods").value.trim(),tp:tp,sold:tp.map(function(){return 0}),mine:true};
 EV.push(ne);save();org();window.scrollTo(0,0);toast("Evento publicado. Ele já aparece na agenda.")}

/* ---------- ações ---------- */
document.addEventListener("click",function(ev){var b=ev.target.closest("[data-a]");if(!b||b.disabled)return;var a=b.dataset.a,v=b.dataset.v;
 if(a=="nav"){S.confirm=null;go(v)}
 else if(a=="cat"){S.cat=v;explorar()}
 else if(a=="when"){S.when=v;explorar()}
 else if(a=="mode"){S.mode=v;explorar()}
 else if(a=="pin"){S.b=S.b==v?"Todos":v;explorar()}
 else if(a=="clear"){S.q="";S.cat="Todas";S.when="todos";S.b="Todos";S.free=false;S.favOnly=false;explorar()}
 else if(a=="fav"){var id=+v;if(S.fav.has(id))S.fav.delete(id);else S.fav.add(id);save();
  if(S.sel==null)explorar();else detalhe();toast(S.fav.has(id)?"Evento salvo.":"Removido dos salvos.")}
 else if(a=="open"||a=="page"){go("evento-"+v)}
 else if(a=="back"){go("explorar")}
 else if(a=="qty"){var e=cur(),i=+b.dataset.i,n=(S.qty[i]||0)+ +b.dataset.d,max=Math.min(6,left(e,i));
  if(n<0)n=0;if(n>max){n=max;toast(left(e,i)<6?"Só restam "+left(e,i)+" ingressos deste tipo.":"Limite de 6 ingressos por tipo.")}
  S.qty[i]=n;detalhe()}
 else if(a=="go"){S.step="pagar";S.err="";render(true)}
 else if(a=="step"){S.step=v;S.err="";render(true)}
 else if(a=="copy"){var txt=$("pc").textContent;
  function sel(){var r=document.createRange();r.selectNodeContents($("pc"));var s=getSelection();s.removeAllRanges();s.addRange(r);toast("Código selecionado. Copie com Ctrl+C ou toque longo.")}
  try{navigator.clipboard.writeText(txt).then(function(){toast("Código Pix copiado.")},sel)}catch(e){sel()}}
 else if(a=="pixok"){issue()}
 else if(a=="val"){var t=S.tk[+b.dataset.i];
  if(t.used){S.msg[t.code]="Entrada negada: este ingresso já foi lido às "+t.usedAt+".";ingressos()}
  else{t.used=true;t.usedAt=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});delete S.msg[t.code];save();ingressos();toast("Entrada liberada.")}}
 else if(a=="cancel"){S.confirm="c:"+v;ingressos()}
 else if(a=="nocancel"){S.confirm=null;ingressos()}
 else if(a=="cancelok"){var t2=S.tk[+b.dataset.i],e2=byId(t2.evId);
  if(e2){var k=e2.tp.map(function(x){return x.n}).indexOf(t2.tp);if(k>=0&&e2.sold[k]>0)e2.sold[k]--}
  S.tk.splice(+b.dataset.i,1);S.confirm=null;save();render();toast(t2.p?"Ingresso cancelado. Reembolso de "+money(t2.p)+" (simulado).":"Inscrição cancelada.")}
 else if(a=="del"){S.confirm="d:"+v;org()}
 else if(a=="nodel"){S.confirm=null;org()}
 else if(a=="delok"){EV=EV.filter(function(e){return e.id!=v});S.fav.delete(+v);S.confirm=null;save();org();toast("Evento excluído.")}
});
document.addEventListener("keydown",function(e){if((e.key=="Enter"||e.key==" ")&&e.target.matches&&e.target.matches("[role=button][data-a]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});

route();
</script>
