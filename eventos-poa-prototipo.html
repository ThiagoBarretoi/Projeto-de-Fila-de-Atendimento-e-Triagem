<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eventos POA – protótipo</title>
<style>
:root{--bg:#F1F5F6;--sf:#fff;--ink:#14232B;--mu:#566870;--ln:#D3DDE1;--br:#1F7A8C;--bi:#fff;--sun:#F2B84B;--si:#4A3200;--ok:#2E7D4F;--er:#B3392F;--wt:#CFE6EC;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1F;--sf:#16252C;--ink:#E6EEF1;--mu:#9FB0B8;--ln:#2A3C45;--br:#4FB3C6;--bi:#06242B;--ok:#6CCB92;--er:#F08A80;--wt:#1B3A45}}
:root[data-theme="dark"]{--bg:#0F1A1F;--sf:#16252C;--ink:#E6EEF1;--mu:#9FB0B8;--ln:#2A3C45;--br:#4FB3C6;--bi:#06242B;--ok:#6CCB92;--er:#F08A80;--wt:#1B3A45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;margin:0;line-height:1.2}
h1{font-size:26px}h2{font-size:22px}h3{font-size:18px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mu{color:var(--mu);font-size:14px}
nav{display:flex;gap:4px;margin:14px 0;border-bottom:1px solid var(--ln)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:inherit;color:var(--mu);cursor:pointer}
nav button[aria-current=true]{color:var(--ink);border-color:var(--br);font-weight:600}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:10px}
.ev{display:flex;gap:12px;cursor:pointer;align-items:stretch}
.ev:hover,.ev:focus-visible{border-color:var(--br)}
.dt{flex:none;width:58px;border-radius:8px;background:var(--sun);color:var(--si);text-align:center;padding:6px 0;line-height:1.1}
.dt b{display:block;font-size:24px}.dt span{font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:20px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--br);color:var(--bi);border-color:var(--br)}
input,select{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;width:100%}
label{display:block;font-size:14px;margin:10px 0 4px}
.btn{font:inherit;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;padding:9px 16px;cursor:pointer}
.btn.p{background:var(--br);color:var(--bi);border-color:var(--br);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.tag{font-size:12px;border-radius:4px;padding:2px 7px;background:var(--wt);color:var(--ink)}
.tag.ok{color:var(--ok)}.tag.er{color:var(--er)}
.er:not(.tag){color:var(--er);font-size:14px;margin:6px 0 0}
.tk{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--ln)}
.q{display:flex;align-items:center;gap:10px}.q button{width:34px;height:34px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font-size:18px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin:12px 0}
svg.map{width:100%;height:auto;border:1px solid var(--ln);border-radius:12px;background:var(--sf);margin-bottom:10px}
.pin{cursor:pointer}.pin circle{fill:var(--br)}.pin[aria-pressed=true] circle{fill:var(--sun);stroke:var(--si);stroke-width:2}
.pin text{fill:var(--bi);font:700 13px system-ui}.pin[aria-pressed=true] text{fill:var(--si)}
.lb{fill:var(--mu);font:12px system-ui}
.qr{background:#fff;padding:8px;border-radius:8px;display:inline-block;line-height:0}
#toast{position:sticky;bottom:12px;margin:0 auto;width:max-content;max-width:100%;background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 16px;display:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="w">
<div class="top"><h1>Eventos POA</h1><span class="mu">Protótipo com dados de exemplo</span></div>
<nav id="nav" aria-label="Seções"></nav>
<main id="m"></main>
<div id="toast" role="status" aria-live="polite"></div>
</div>
<script>
var BAIRROS={"Centro Histórico":[165,120],"Cidade Baixa":[215,150],"Farroupilha":[205,105],"Moinhos de Vento":[270,70],"Praia de Belas":[170,200],"Humaitá":[250,230]};
var CATS=["Música","Teatro","Gastronomia","Esporte","Feira","Cinema"];
var EV=[
{id:1,t:"Pôr do sol com orquestra",c:"Música",b:"Centro Histórico",l:"Usina do Gasômetro",d:"2026-11-28",h:"18:00",tp:[{n:"Inteira",p:60,q:200},{n:"Meia-entrada",p:30,q:100},{n:"Camarote",p:120,q:30}],s:0},
{id:2,t:"Feira do Livro ao ar livre",c:"Feira",b:"Farroupilha",l:"Parque da Redenção",d:"2026-11-22",h:"10:00",tp:[{n:"Entrada gratuita",p:0,q:500}],s:0},
{id:3,t:"Noite de samba",c:"Música",b:"Cidade Baixa",l:"Casa de shows da República",d:"2026-11-27",h:"21:00",tp:[{n:"Inteira",p:40,q:150},{n:"Meia-entrada",p:20,q:80}],s:0},
{id:4,t:"Peça: Quando o Guaíba dorme",c:"Teatro",b:"Centro Histórico",l:"Teatro do Centro",d:"2026-12-04",h:"20:00",tp:[{n:"Inteira",p:50,q:120},{n:"Meia-entrada",p:25,q:60}],s:0},
{id:5,t:"Festival de comida de rua",c:"Gastronomia",b:"Moinhos de Vento",l:"Parcão",d:"2026-11-29",h:"12:00",tp:[{n:"Entrada solidária (1 kg de alimento)",p:0,q:300},{n:"Entrada + 2 fichas",p:25,q:200}],s:0},
{id:6,t:"Corrida 5K da orla",c:"Esporte",b:"Praia de Belas",l:"Parque Marinha",d:"2026-12-06",h:"07:30",tp:[{n:"Inscrição",p:70,q:400}],s:0},
{id:7,t:"Cinema ao ar livre",c:"Cinema",b:"Humaitá",l:"Praça do bairro",d:"2026-12-05",h:"20:30",tp:[{n:"Entrada gratuita",p:0,q:250}],s:0},
{id:8,t:"Jazz no bistrô",c:"Música",b:"Moinhos de Vento",l:"Bistrô Moinhos",d:"2026-12-11",h:"21:00",tp:[{n:"Inteira",p:80,q:60},{n:"Meia-entrada",p:40,q:30}],s:0}];
var S={v:"explorar",mode:"lista",q:"",cat:"Todas",b:"Todos",free:false,sel:null,step:"detalhe",qty:{},tk:[],err:"",busy:false,last:[]};
var $=function(i){return document.getElementById(i)};
var R=function(n){return n?"R$ "+n.toFixed(2).replace(".",","):"Gratuito"};
function fd(e){var d=new Date(e.d+"T12:00");return{w:d.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".",""),n:d.getDate(),m:d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","")}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function minP(e){return Math.min.apply(0,e.tp.map(function(t){return t.p}))}
function left(e,i){return e.tp[i].q-e.s_[i]}
EV.forEach(function(e){e.s_=e.tp.map(function(){return 0})});
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.k);toast.k=setTimeout(function(){t.style.display="none"},2600)}
function nav(){var a=[["explorar","Explorar"],["ingressos","Meus ingressos ("+S.tk.length+")"],["org","Organizador"]];
$("nav").innerHTML=a.map(function(x){return '<button data-a="v" data-v="'+x[0]+'" aria-current="'+(S.v==x[0])+'">'+x[1]+'</button>'}).join("")}
function render(){nav();S.v=="explorar"?(S.sel==null?explorar():S.step=="detalhe"?detalhe():S.step=="pagar"?pagar():ok()):S.v=="ingressos"?ingressos():org();window.scrollTo(0,0)}
function explorar(){
$("m").innerHTML='<label for="q" style="margin-top:0">Buscar evento ou local</label><input id="q" type="search" placeholder="Ex.: samba, Redenção" value="'+esc(S.q)+'">'+
'<div class="row" style="margin:10px 0" role="group" aria-label="Categorias">'+["Todas"].concat(CATS).map(function(c){return '<button class="chip" data-a="cat" data-v="'+c+'" aria-pressed="'+(S.cat==c)+'">'+c+'</button>'}).join("")+'</div>'+
'<div class="g2"><div><label for="bs" style="margin-top:0">Bairro</label><select id="bs"><option>Todos</option>'+Object.keys(BAIRROS).map(function(b){return '<option'+(S.b==b?" selected":"")+'>'+b+'</option>'}).join("")+'</select></div>'+
'<div class="row" style="align-self:end"><label style="display:flex;gap:8px;align-items:center;margin:0"><input id="fr" type="checkbox" style="width:auto"'+(S.free?" checked":"")+'> Só gratuitos</label></div></div>'+
'<div class="row" style="margin:14px 0"><button class="chip" data-a="mode" data-v="lista" aria-pressed="'+(S.mode=="lista")+'">Lista</button><button class="chip" data-a="mode" data-v="mapa" aria-pressed="'+(S.mode=="mapa")+'">Mapa</button></div><div id="r"></div>';
$("q").oninput=function(){S.q=this.value;res()};$("bs").onchange=function(){S.b=this.value;res()};$("fr").onchange=function(){S.free=this.checked;res()};res()}
function filt(ignB){var q=S.q.toLowerCase();return EV.filter(function(e){return(S.cat=="Todas"||e.c==S.cat)&&(ignB||S.b=="Todos"||e.b==S.b)&&(!S.free||minP(e)==0)&&(!q||(e.t+" "+e.l+" "+e.b).toLowerCase().indexOf(q)>=0)}).sort(function(a,b){return a.d<b.d?-1:1})}
function res(){var h="";
if(S.mode=="mapa"){var all=filt(true),cnt={};all.forEach(function(e){cnt[e.b]=(cnt[e.b]||0)+1});
h+='<svg class="map" viewBox="0 0 400 280" role="group" aria-label="Mapa esquemático de Porto Alegre"><path d="M0 0H105C85 60 125 100 95 150C65 200 105 240 85 280H0Z" fill="var(--wt)"/><text class="lb" x="22" y="145">Guaíba</text>'+
Object.keys(BAIRROS).map(function(b){var p=BAIRROS[b],n=cnt[b]||0;if(!n)return '<text class="lb" x="'+p[0]+'" y="'+(p[1]+28)+'" text-anchor="middle" opacity=".5">'+b+'</text>';
return '<g class="pin" tabindex="0" role="button" data-a="pin" data-v="'+b+'" aria-pressed="'+(S.b==b)+'" aria-label="'+b+': '+n+' eventos"><circle cx="'+p[0]+'" cy="'+p[1]+'" r="15"/><text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle">'+n+'</text></g><text class="lb" x="'+p[0]+'" y="'+(p[1]+31)+'" text-anchor="middle">'+b+'</text>'}).join("")+'</svg>'}
var L=filt(false);
h+=L.length?L.map(function(e){var d=fd(e);return '<div class="card ev" tabindex="0" role="button" data-a="open" data-v="'+e.id+'"><div class="dt"><span>'+d.w+'</span><b>'+d.n+'</b><span>'+d.m+'</span></div><div><h3>'+esc(e.t)+'</h3><div class="mu">'+esc(e.l)+', '+e.b+' · '+e.h+'</div><div class="row" style="margin-top:6px"><span class="tag">'+e.c+'</span><span class="tag">'+(minP(e)?"a partir de "+R(minP(e)):"Gratuito")+'</span></div></div></div>'}).join(""):'<div class="card"><b>Nenhum evento encontrado.</b><p class="mu" style="margin:4px 0 10px">Tente outra categoria ou remova os filtros.</p><button class="btn" data-a="clear">Limpar filtros</button></div>';
$("r").innerHTML=h}
function cur(){return EV.filter(function(e){return e.id==S.sel})[0]}
function sum(e){var t=0,n=0;e.tp.forEach(function(x,i){var q=S.qty[i]||0;t+=q*x.p;n+=q});return{t:t,n:n}}
function detalhe(){var e=cur(),d=fd(e),s=sum(e);
$("m").innerHTML='<button class="btn" data-a="back">‹ Voltar</button><div class="card" style="margin-top:12px"><span class="tag">'+e.c+'</span><h2 style="margin:8px 0 4px">'+esc(e.t)+'</h2><div class="mu">'+d.w+', '+d.n+' de '+d.m+' às '+e.h+'</div><div class="mu">'+esc(e.l)+' · '+e.b+', Porto Alegre</div></div>'+
'<div class="card"><h3>Ingressos</h3>'+e.tp.map(function(t,i){var r=left(e,i);return '<div class="tk"><div><b>'+esc(t.n)+'</b><div class="mu">'+R(t.p)+' · '+(r>0?r+" disponíveis":"esgotado")+'</div></div><div class="q"><button data-a="qty" data-i="'+i+'" data-d="-1" aria-label="Menos '+esc(t.n)+'">−</button><b aria-live="polite">'+(S.qty[i]||0)+'</b><button data-a="qty" data-i="'+i+'" data-d="1" aria-label="Mais '+esc(t.n)+'">+</button></div></div>'}).join("")+
'<div class="tot"><span>Total</span><span>'+R(s.t)+'</span></div><button class="btn p" data-a="go"'+(s.n?"":" disabled")+'>Continuar para o pagamento</button>'+(s.n?"":'<p class="mu" style="margin:8px 0 0">Escolha ao menos um ingresso.</p>')+'</div>'}
function pagar(){var e=cur(),s=sum(e);
$("m").innerHTML='<button class="btn" data-a="step" data-v="detalhe">‹ Voltar</button><div class="card" style="margin-top:12px"><h2>Pagamento</h2><p class="mu" style="margin:4px 0 0">'+esc(e.t)+' · '+s.n+' ingresso(s) · <b>'+R(s.t)+'</b></p>'+
'<label for="nm">Nome completo</label><input id="nm" autocomplete="name"><label for="em">E-mail</label><input id="em" type="email" autocomplete="email"><label for="fp">Forma de pagamento</label><select id="fp">'+(s.t?'<option>Pix</option><option>Cartão de crédito</option>':'<option>Sem pagamento (gratuito)</option>')+'</select>'+
'<div class="er" id="er" role="alert">'+esc(S.err)+'</div><button class="btn p" id="pb" data-a="pay" style="margin-top:14px">'+(s.t?"Pagar "+R(s.t):"Confirmar inscrição")+'</button><p class="mu" style="margin:10px 0 0">Ambiente de teste: nenhum pagamento real é feito.</p></div>'}
function code(){return"POA-"+Math.random().toString(36).slice(2,8).toUpperCase()}
function qr(c){var h=0,i;for(i=0;i<c.length;i++)h=(h*31+c.charCodeAt(i))>>>0;var n=21,g=[],r="";
function f(x,y){return(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12)}
for(var y=0;y<n;y++)for(var x=0;x<n;x++){var on;if(f(x,y)){var ox=x>12?x-14:x,oy=y>12?y-14:y;on=ox<7&&oy<7&&(ox==0||ox==6||oy==0||oy==6||(ox>1&&ox<5&&oy>1&&oy<5))}else{h=(h*1103515245+12345)>>>0;on=(h>>>16)%2==0}
if(on)r+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'}
return '<span class="qr"><svg width="120" height="120" viewBox="0 0 21 21" role="img" aria-label="QR code do ingresso '+c+'" fill="#000" shape-rendering="crispEdges">'+r+'</svg></span>'}
function ok(){var L=S.last;$("m").innerHTML='<div class="card"><h2>Compra confirmada</h2><p class="mu" style="margin:4px 0 12px">Enviamos os ingressos para o seu e-mail (simulado). Apresente o QR code na entrada.</p>'+L.map(function(t){return '<div class="tk"><div><b>'+esc(t.ev)+'</b><div class="mu">'+esc(t.tp)+' · '+t.code+'</div></div>'+qr(t.code)+'</div>'}).join("")+'<div class="row" style="margin-top:12px"><button class="btn p" data-a="v" data-v="ingressos">Ver meus ingressos</button><button class="btn" data-a="back">Buscar mais eventos</button></div></div>'}
function ingressos(){$("m").innerHTML=S.tk.length?S.tk.map(function(t,i){return '<div class="card"><div class="tk" style="border:0;padding:0"><div><h3>'+esc(t.ev)+'</h3><div class="mu">'+esc(t.tp)+' · '+t.dt+'</div><div class="mu">'+t.code+'</div><div style="margin:8px 0"><span class="tag '+(t.used?"er":"ok")+'">'+(t.used?"Já utilizado":"Válido")+'</span></div><button class="btn" data-a="val" data-i="'+i+'">Simular leitura na portaria</button><div class="er" id="v'+i+'" role="alert"></div></div>'+qr(t.code)+'</div></div>'}).join(""):'<div class="card"><b>Você ainda não tem ingressos.</b><p class="mu" style="margin:4px 0 10px">Encontre um evento e compre em poucos toques.</p><button class="btn p" data-a="v" data-v="explorar">Explorar eventos</button></div>'}
function org(){var mine=EV.filter(function(e){return e.mine});
$("m").innerHTML='<div class="card"><h2>Publicar evento</h2><label for="ot">Título</label><input id="ot"><div class="g2"><div><label for="oc">Categoria</label><select id="oc">'+CATS.map(function(c){return "<option>"+c+"</option>"}).join("")+'</select></div><div><label for="ob">Bairro</label><select id="ob">'+Object.keys(BAIRROS).map(function(b){return "<option>"+b+"</option>"}).join("")+'</select></div></div><label for="ol">Local</label><input id="ol"><div class="g2"><div><label for="od">Data</label><input id="od" type="date"></div><div><label for="oh">Horário</label><input id="oh" type="time" value="20:00"></div><div><label for="op">Preço da inteira (R$, 0 = gratuito)</label><input id="op" type="number" min="0" step="0.01" value="0"></div><div><label for="oq">Quantidade de ingressos</label><input id="oq" type="number" min="1" value="100"></div></div><div class="er" id="oe" role="alert"></div><button class="btn p" data-a="pub" style="margin-top:14px">Publicar evento</button></div>'+
(mine.length?'<h3 style="margin:18px 0 8px">Seus eventos</h3>'+mine.map(function(e){var v=e.s_.reduce(function(a,b){return a+b},0),r=e.tp.reduce(function(a,t){return a+t.q},0);return '<div class="card"><b>'+esc(e.t)+'</b><div class="mu">'+v+' de '+r+' ingressos vendidos · '+R(e.s_.reduce(function(a,n,i){return a+n*e.tp[i].p},0))+' arrecadados</div></div>'}).join(""):"")}
document.addEventListener("click",function(ev){var b=ev.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,v=b.dataset.v;
if(a=="v"){S.v=v;if(v=="explorar"){S.sel=null}render()}
else if(a=="cat"){S.cat=v;explorar()}
else if(a=="mode"){S.mode=v;explorar()}
else if(a=="pin"){S.b=S.b==v?"Todos":v;explorar()}
else if(a=="clear"){S.q="";S.cat="Todas";S.b="Todos";S.free=false;explorar()}
else if(a=="open"){S.sel=+v;S.qty={};S.step="detalhe";S.err="";render()}
else if(a=="back"){S.v="explorar";S.sel=null;render()}
else if(a=="qty"){var e=cur(),i=+b.dataset.i,n=(S.qty[i]||0)+ +b.dataset.d;if(n<0)n=0;if(n>Math.min(6,left(e,i))){n=Math.min(6,left(e,i));toast("Limite de 6 ingressos por tipo.")}S.qty[i]=n;detalhe()}
else if(a=="go"){S.step="pagar";S.err="";render()}
else if(a=="step"){S.step=v;render()}
else if(a=="pay"&&!S.busy){var nm=$("nm").value.trim(),em=$("em").value.trim();
if(nm.length<3){S.err="Informe seu nome completo.";$("er").textContent=S.err;$("nm").focus();return}
if(!/^\S+@\S+\.\S+$/.test(em)){S.err="Informe um e-mail válido, como nome@email.com.";$("er").textContent=S.err;$("em").focus();return}
S.busy=true;b.disabled=true;b.textContent="Processando pagamento…";
setTimeout(function(){var e=cur(),d=fd(e);S.last=[];e.tp.forEach(function(t,i){for(var k=0;k<(S.qty[i]||0);k++){var x={ev:e.t,tp:t.n,code:code(),used:false,dt:d.n+" "+d.m+" às "+e.h};S.tk.push(x);S.last.push(x)}e.s_[i]+=S.qty[i]||0});
S.busy=false;S.step="ok";render();toast("Pagamento aprovado.")},1100)}
else if(a=="val"){var t=S.tk[+b.dataset.i],m=$("v"+b.dataset.i);if(t.used){m.textContent="Ingresso já utilizado: entrada negada."}else{t.used=true;ingressos();toast("Entrada liberada.")}}
else if(a=="pub"){var T=$("ot").value.trim(),D=$("od").value,P=parseFloat($("op").value)||0,Q=parseInt($("oq").value)||0,E=$("oe");
if(T.length<3||!$("ol").value.trim()){E.textContent="Preencha o título e o local.";return}
if(!D){E.textContent="Escolha a data do evento.";return}
